name: Update market prices


on:
  schedule:
    # 10:30 Asia/Seoul (= 01:30 UTC) — KRX 전 거래일 종가가 공개된 뒤 실행한다.
    - cron: "30 1 * * *"
  workflow_dispatch:


permissions:
  contents: write


concurrency:
  group: update-market-prices
  cancel-in-progress: false


jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install parser dependencies
        run: python -m pip install -r requirements.txt

      - name: Pull manual edits from Google Sheet
        run: python -m scripts.sheets_sync pull-admin

      - name: Refresh latest KRX close
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6 7; do
            if python -m scripts.quick_refresh --no-pull --prices --require-latest-close; then
              exit 0
            fi
            if [ "$attempt" = "7" ]; then
              echo "Latest KRX close was not available after 7 attempts."
              exit 1
            fi
            echo "Latest KRX close is not ready; retrying in 10 minutes ($attempt/7)."
            sleep 600
          done

      - name: Update Google Sheet
        run: python -m scripts.sheets_sync push-all

      - name: Commit generated data
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: update market prices"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
          done
          git push
